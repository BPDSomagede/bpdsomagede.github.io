name: Sinkron Preview Berita BPD Somagede

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/main.yml'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  sync-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Buat preview permanen dengan foto lokal
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.parse import quote, urljoin
          import json, html, re, io
          from PIL import Image

          API='https://bpd-somagede-cms.bpddesasomagede.workers.dev'
          SITE='https://bpdsomagede.github.io/'
          OUT=Path('berita')
          OUT.mkdir(exist_ok=True)

          def get_json(path):
              req=Request(API+path,headers={
                  'User-Agent':'BPD-Somagede-Preview-Sync/2.0',
                  'Accept':'application/json'
              })
              with urlopen(req,timeout=30) as r:
                  return json.loads(r.read().decode('utf-8'))

          def clean_text(value,limit=180):
              s=re.sub(r'<[^>]+>',' ',str(value or ''))
              s=re.sub(r'\s+',' ',s).strip()
              return s[:limit].rstrip()

          def save_cover(url, folder):
              if not url:
                  return None
              if url.startswith('/'):
                  url=urljoin(SITE,url)
              try:
                  req=Request(url,headers={'User-Agent':'BPD-Somagede-Preview-Image/2.0'})
                  with urlopen(req,timeout=45) as r:
                      raw=r.read()
                  im=Image.open(io.BytesIO(raw)).convert('RGB')
                  target=folder/'cover.jpg'
                  im.save(target,'JPEG',quality=88,optimize=True,progressive=True)
                  return f'{SITE}berita/{quote(folder.name,safe="-._~")}/cover.jpg'
              except Exception as e:
                  print('Gagal menyimpan foto:',e)
                  return None

          records={}

          try:
              archive=get_json('/api/archive')
              for row in archive.get('years') or []:
                  year=str(row.get('year') or '').strip()
                  if not year:
                      continue
                  try:
                      data=get_json('/api/archive/'+quote(year,safe=''))
                      for item in data.get('items') or []:
                          slug=str(item.get('slug') or '').strip()
                          if slug:
                              records[slug]=item
                  except Exception as e:
                      print('Arsip',year,e)
          except Exception as e:
              print('Daftar arsip:',e)

          try:
              data=get_json('/api/activities?limit=500')
              for item in data.get('items') or []:
                  slug=str(item.get('slug') or '').strip()
                  if slug:
                      records[slug]=item
          except Exception as e:
              print('Daftar aktivitas:',e)

          if not records:
              raise SystemExit('Tidak ada berita yang berhasil dibaca dari CMS.')

          made=0
          photos=0

          for slug,base in sorted(records.items()):
              item=dict(base)
              try:
                  detail=get_json('/api/activities/slug/'+quote(slug,safe=''))
                  if detail.get('ok') and detail.get('item'):
                      item.update(detail['item'])
              except Exception as e:
                  print('Detail',slug,e)

              title=clean_text(item.get('title') or 'Berita BPD Somagede',220)
              desc=clean_text(item.get('excerpt') or item.get('summary') or item.get('content') or
                              'Informasi kegiatan Badan Permusyawaratan Desa Somagede.',190)

              cover=str(item.get('cover_url') or '').strip()
              if not cover:
                  for img in item.get('images') or []:
                      if isinstance(img,dict) and img.get('url'):
                          cover=str(img['url']).strip(); break
                      if isinstance(img,str) and img.strip():
                          cover=img.strip(); break

              safe_slug=quote(slug,safe='-._~')
              folder=OUT/safe_slug
              folder.mkdir(parents=True,exist_ok=True)

              local=save_cover(cover,folder)
              if local:
                  photos+=1
                  image_url=local
              else:
                  image_url=SITE+'bpd-favicon.png'

              preview=f'{SITE}berita/{safe_slug}/'
              article=f'{SITE}?berita={quote(slug,safe="")}#bpdPortalBerita'
              et=html.escape(title,quote=True)
              ed=html.escape(desc,quote=True)
              ei=html.escape(image_url,quote=True)
              ep=html.escape(preview,quote=True)
              ea=html.escape(article,quote=True)
              target=json.dumps(article,ensure_ascii=False)

              schema=json.dumps({
                  '@context':'https://schema.org',
                  '@type':'NewsArticle',
                  'headline':title,
                  'description':desc,
                  'datePublished':item.get('activity_date') or None,
                  'image':[image_url],
                  'mainEntityOfPage':preview,
                  'inLanguage':'id-ID',
                  'publisher':{'@type':'GovernmentOrganization','name':'BPD Somagede','url':SITE}
              },ensure_ascii=False).replace('</','<\/')

              page=f'''<!doctype html>
<html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{et} | BPD Somagede</title>
<meta name="description" content="{ed}">
<link rel="canonical" href="{ep}">
<meta property="og:type" content="article">
<meta property="og:site_name" content="BPD Somagede">
<meta property="og:title" content="{et}">
<meta property="og:description" content="{ed}">
<meta property="og:url" content="{ep}">
<meta property="og:image" content="{ei}">
<meta property="og:image:secure_url" content="{ei}">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:alt" content="{et}">
<meta property="og:locale" content="id_ID">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{et}">
<meta name="twitter:description" content="{ed}">
<meta name="twitter:image" content="{ei}">
<script type="application/ld+json">{schema}</script>
<style>
body{{font-family:Arial,sans-serif;margin:0;background:#f4f7f6;color:#17352d}}
main{{max-width:760px;margin:40px auto;padding:24px}}
img{{display:block;width:100%;max-height:440px;object-fit:cover;border-radius:14px}}
h1{{font-size:clamp(25px,4vw,40px);line-height:1.15}}
p{{line-height:1.65}} a{{color:#087f5b;font-weight:700}}
</style>
<script>window.addEventListener('DOMContentLoaded',function(){{window.location.replace({target});}});</script>
</head><body><main>
<img src="{ei}" alt="{et}"><h1>{et}</h1><p>{ed}</p>
<p><a href="{ea}">Buka berita di website resmi BPD Somagede</a></p>
</main></body></html>'''

              (folder/'index.html').write_text(page,encoding='utf-8')
              made+=1

          js=Path('bpd-portal-berita.js')
          text=js.read_text(encoding='utf-8')
          replacement='''function shareUrl(item){
            const slug=encodeURIComponent(item?.slug||'');
            return `https://bpdsomagede.github.io/berita/${slug}/`;
          }'''
          text,n=re.subn(r'function shareUrl\(item\)\{.*?\n\}',replacement,text,count=1,flags=re.S)
          if n!=1:
              raise SystemExit('Fungsi shareUrl tidak ditemukan.')
          js.write_text(text,encoding='utf-8')

          print(f'Preview: {made}; foto lokal: {photos}')
          PY

      - name: Validasi
        shell: bash
        run: |
          node --check bpd-portal-berita.js
          python - <<'PY'
          from pathlib import Path
          import re
          pages=list(Path('berita').glob('*/index.html'))
          if not pages:
              raise SystemExit('Tidak ada halaman preview.')
          for p in pages:
              s=p.read_text(encoding='utf-8')
              m=re.search(r'<meta property="og:image" content="([^"]+)"',s)
              if not m or not m.group(1).startswith('https://bpdsomagede.github.io/berita/'):
                  raise SystemExit(f'og:image salah: {p}')
              cover=p.parent/'cover.jpg'
              if not cover.exists() or cover.stat().st_size < 1000:
                  raise SystemExit(f'cover.jpg tidak ada: {cover}')
          print(f'VALID: {len(pages)} preview memakai foto lokal GitHub Pages.')
          PY

      - name: Commit hasil
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add berita bpd-portal-berita.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Permanenkan foto preview berita di GitHub Pages"
          git push
