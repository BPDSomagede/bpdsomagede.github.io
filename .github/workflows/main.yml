name: Sinkron Preview Berita BPD Somagede
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/main.yml'
      - 'berita/**'
      - 'bpd-portal-berita.js'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validasi preview
        run: |
          node --check bpd-portal-berita.js
          python - <<'PY'
          from pathlib import Path
          pages=list(Path('berita').glob('*/index.html'))
          assert pages, 'Tidak ada halaman berita.'
          for p in pages:
              s=p.read_text(encoding='utf-8')
              for token in ('og:image','og:url','twitter:image'):
                  assert token in s, f'{token} hilang: {p}'
          print(f'VALID: {len(pages)} halaman preview.')
          PY
