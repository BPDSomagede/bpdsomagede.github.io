name: Sinkron Preview Berita BPD Somagede

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/main.yml'

concurrency:
  group: bpd-preview-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Generate preview pages
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.parse import quote, urljoin
          import json, html, re

          API='https://bpd-somagede-cms.bpddesasomagede.workers.dev'
          SITE='https://bpdsomagede.github.io/'
          OUT=Path('berita')
          OUT.mkdir(exist_ok=True)
          SPECIAL='semarak-hut-ke-72-ri-tahun-2017-bpd-dan-perangkat-desa-somagede-ikut-sukseskan-jalan-santa-20170813'
          SPECIAL_COVER='https://res.cloudinary.com/k2mss5sn/image/upload/v1786842763/bpd-somagede/kegiatan/41/57ef5a77-afa4-4d56-aef4-0b6613e75b56.webp'

          def get_json(path):
              req=Request(API+path,headers={'User-Agent':'BPD-Somagede-Preview-Sync/3.0','Accept':'application/json'})
              with urlopen(req,timeout=30) as r:
                  return json.loads(r.read().decode('utf-8'))

          def clean(v,n=190):
              s=re.sub(r'<[^>]+>',' ',str(v or ''))
              s=re.sub(r'\s+',' ',s).strip()
              return s[:n].rstrip()

          records={}
          try:
              for row in get_json('/api/archive').get('years') or []:
                  y=str(row.get('year') or '').strip()
                  if y:
                      try:
                          for x in get_json('/api/archive/'+quote(y,safe='')).get('items') or []:
                              if x.get('slug'): records[str(x['slug'])]=x
                      except Exception as e: print('archive',y,e)
          except Exception as e: print('archive list',e)
          try:
              for x in get_json('/api/activities?limit=500').get('items') or []:
                  if x.get('slug'): records[str(x['slug'])]=x
          except Exception as e: print('activities',e)
          if not records:
              raise SystemExit('CMS tidak mengembalikan berita.')

          for slug,base in sorted(records.items()):
              item=dict(base)
              try:
                  d=get_json('/api/activities/slug/'+quote(slug,safe=''))
                  if d.get('ok') and d.get('item'): item.update(d['item'])
              except Exception as e: print('detail',slug,e)

              sslug=quote(slug,safe='-._~')
              folder=OUT/sslug
              folder.mkdir(parents=True,exist_ok=True)
              title=clean(item.get('title') or 'Berita BPD Somagede',220)
              desc=clean(item.get('excerpt') or item.get('summary') or item.get('content') or 'Informasi kegiatan Badan Permusyawaratan Desa Somagede.')

              # Berita HUT 2017 dikunci ke URL sampul yang terbukti pernah berhasil.
              if slug == SPECIAL:
                  cover=SPECIAL_COVER
              else:
                  local=folder/'cover.jpg'
                  if local.exists() and local.stat().st_size:
                      cover=f'{SITE}berita/{sslug}/cover.jpg'
                  else:
                      cover=str(item.get('cover_url') or '').strip()
                      if not cover:
                          for img in (item.get('images') or []):
                              if isinstance(img,dict) and img.get('url'):
                                  cover=str(img['url']).strip(); break
                              if isinstance(img,str) and img.strip():
                                  cover=img.strip(); break
                      if cover.startswith('/'):
                          cover=urljoin(SITE,cover)
                      if not cover: cover=SITE+'bpd-favicon.png'

              url=f'{SITE}berita/{sslug}/'
              article=f'{SITE}?berita={quote(slug,safe="")}#bpdPortalBerita'
              t=html.escape(title,quote=True); d=html.escape(desc,quote=True); c=html.escape(cover,quote=True); u=html.escape(url,quote=True)
              schema=json.dumps({'@context':'https://schema.org','@type':'NewsArticle','headline':title,'description':desc,'datePublished':item.get('activity_date') or None,'image':[cover],'mainEntityOfPage':url,'inLanguage':'id-ID','publisher':{'@type':'GovernmentOrganization','name':'BPD Somagede','url':SITE}},ensure_ascii=False)
              page=f'''<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{t} | BPD Somagede</title><meta name="description" content="{d}"><link rel="canonical" href="{u}"><meta property="og:type" content="article"><meta property="og:site_name" content="BPD Somagede"><meta property="og:title" content="{t}"><meta property="og:description" content="{d}"><meta property="og:url" content="{u}"><meta property="og:image" content="{c}"><meta property="og:image:secure_url" content="{c}"><meta property="og:image:type" content="image/webp"><meta property="og:image:alt" content="{t}"><meta property="og:locale" content="id_ID"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="{t}"><meta name="twitter:description" content="{d}"><meta name="twitter:image" content="{c}"><script type="application/ld+json">{schema}</script></head><body><main><img src="{c}" alt="{t}" style="max-width:100%;height:auto"><h1>{t}</h1><p>{d}</p><p><a href="{html.escape(article,quote=True)}">Buka berita</a></p></main></body></html>'''
              (folder/'index.html').write_text(page,encoding='utf-8')

          print('Preview statis selesai:',len(records))
          PY

      - name: Validate preview
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('berita/semarak-hut-ke-72-ri-tahun-2017-bpd-dan-perangkat-desa-somagede-ikut-sukseskan-jalan-santa-20170813/index.html')
          s=p.read_text(encoding='utf-8')
          expected='https://res.cloudinary.com/k2mss5sn/image/upload/v1786842763/bpd-somagede/kegiatan/41/57ef5a77-afa4-4d56-aef4-0b6613e75b56.webp'
          assert s.count('property="og:image"') == 1
          assert s.count('property="og:image:secure_url"') == 1
          assert s.count('name="twitter:image"') == 1
          assert expected in s, 'Foto sampul HUT 2017 bukan URL yang terbukti pernah berhasil.'
          assert 'balai-desa-somagede.webp' not in s.lower()
          print('VALID: sampul HUT 2017 terkunci ke URL lama yang terbukti berhasil.')
          PY

      - name: Commit hasil
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add berita
          if git diff --cached --quiet; then echo 'Tidak ada perubahan.'; exit 0; fi
          git commit -m 'Pulihkan preview memakai pola foto sampul yang terbukti berhasil'
          git pull --rebase origin main
          git push origin HEAD:main
