name: Sinkron Preview Berita BPD Somagede

on:
  workflow_dispatch:

  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  sync-preview:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pasang Pillow
        run: python -m pip install Pillow

      - name: Buat preview permanen dengan foto lokal
        shell: bash
        run: |
          python - <<'PY'
          print("TEST WORKFLOW BERHASIL")
          PY
