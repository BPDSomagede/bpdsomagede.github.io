<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Memperbarui Portal BPD Desa Somagede</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#eff9f5;
font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#083128}
.card{width:min(620px,100%);background:#fff;border:1px solid #d8ebe3;border-radius:26px;
padding:30px;box-shadow:0 20px 60px rgba(4,54,42,.14);text-align:center}
.logo{width:72px;height:72px;margin:auto;border-radius:22px;display:grid;place-items:center;
background:linear-gradient(135deg,#07845f,#1769e0);color:#fff;font-size:34px}
h1{font-size:clamp(27px,5vw,42px);line-height:1.05;margin:18px 0 10px}
p{color:#5b716b}.bar{height:9px;background:#eaf8f2;border-radius:999px;overflow:hidden;margin:24px 0}
.bar span{display:block;width:35%;height:100%;border-radius:inherit;background:#07845f;animation:run 1s infinite alternate}
@keyframes run{to{transform:translateX(185%)}}
.ok{font-weight:900;color:#07845f}.err{font-weight:900;color:#c92a3b}
button{border:0;background:#07845f;color:#fff;padding:12px 18px;border-radius:13px;font-weight:900;cursor:pointer}
</style>
</head>
<body>
<div class="card">
<div class="logo">↻</div>
<h1>Memperbarui Portal</h1>
<p id="msg">Menghapus cache beranda lama dan mengambil versi terbaru BPD Desa Somagede…</p>
<div class="bar" id="bar"><span></span></div>
<button id="go" hidden>Buka Beranda Terbaru</button>
</div>
<script>
(async()=>{
  const msg=document.getElementById('msg');
  const bar=document.getElementById('bar');
  const go=document.getElementById('go');

  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }

    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }

    localStorage.removeItem('bpd-home-feed-v2');
    localStorage.removeItem('bpd-kegiatan-cache');

    msg.className='ok';
    msg.textContent='Cache lama berhasil dibersihkan. Membuka beranda terbaru…';
    bar.style.display='none';

    setTimeout(()=>{
      location.replace('./index.html?fresh='+Date.now());
    },700);
  }catch(err){
    msg.className='err';
    msg.textContent='Pembersihan otomatis belum selesai. Klik tombol di bawah.';
    bar.style.display='none';
    go.hidden=false;
    go.onclick=()=>location.replace('./index.html?fresh='+Date.now());
  }
})();
</script>
</body>
</html>
