name: Repair preview now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-preview-now.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ambil foto sampul langsung dari CMS
        shell: bash
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.parse import quote, urljoin

          slug='semarak-hut-ke-72-ri-tahun-2017-bpd-dan-perangkat-desa-somagede-ikut-sukseskan-jalan-santa-20170813'
          api='https://bpd-somagede-cms.bpddesasomagede.workers.dev/api/activities/slug/'+quote(slug,safe='')
          req=Request(api,headers={'User-Agent':'BPD-Somagede-preview-repair/1.0','Accept':'application/json'})
          with urlopen(req,timeout=30) as r:
              data=json.loads(r.read().decode('utf-8'))
          item=data.get('item') or {}
          cover=str(item.get('cover_url') or '').strip()
          if not cover:
              for img in item.get('images') or []:
                  if isinstance(img,dict) and img.get('url'):
                      cover=str(img['url']).strip(); break
                  if isinstance(img,str) and img.strip():
                      cover=img.strip(); break
          if cover.startswith('/'):
              cover=urljoin('https://bpdsomagede.github.io/',cover)
          if not cover:
              raise SystemExit('CMS tidak mengembalikan foto sampul.')
          print('FOTO_SAMPUL_CMS='+cover)

          p=Path('berita')/slug/'index.html'
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'(<meta property="og:image" content=")[^"]*',r'\g<1>'+cover,s,1)
          s=re.sub(r'(<meta property="og:image:secure_url" content=")[^"]*',r'\g<1>'+cover,s,1)
          s=re.sub(r'(<meta name="twitter:image" content=")[^"]*',r'\g<1>'+cover,s,1)
          s=re.sub(r'(<img src=")[^"]*',r'\g<1>'+cover,s,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Simpan hasil
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'berita/semarak-hut-ke-72-ri-tahun-2017-bpd-dan-perangkat-desa-somagede-ikut-sukseskan-jalan-santa-20170813/index.html'
          if git diff --cached --quiet; then
            echo 'Tidak ada perubahan.'
          else
            git commit -m 'Perbaiki foto sampul preview HUT 2017 dari CMS'
            git push
          fi
          git rm .github/workflows/repair-preview-now.yml || true
          if ! git diff --cached --quiet; then
            git commit -m 'Hapus workflow perbaikan sekali jalan'
            git push
          fi
