name: Pulihkan Portal Berita BPD Somagede

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/main.yml'

permissions:
  contents: write

jobs:
  pulihkan-portal:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pulihkan helper hero tanpa menyentuh data berita
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('bpd-portal-berita.js')
          text = p.read_text(encoding='utf-8')

          helper = r"""
          function findHomepageHeroTitle(){
            const scoped=[
              ...document.querySelectorAll('.hero h1,.hero h2,.hero h3,.banner h1,.banner h2,.banner h3,.masthead h1,.masthead h2,.masthead h3')
            ];
            return scoped.find(el=>/Bersama\s+Masyarakat|Pembangunan\s+Desa/i.test(el.textContent||''))
              || [...document.querySelectorAll('h1,h2,h3')].find(el=>/Bersama\s+Masyarakat|Pembangunan\s+Desa/i.test(el.textContent||''))
              || document.querySelector('.hero h1,.hero h2,.hero h3');
          }

          function findHomepageHeroContainer(title){
            return title?.closest('.hero,.hero-section,.hero-banner,.banner,.masthead,[class*="hero"],[class*="banner"]')
              || title?.parentElement
              || null;
          }
          """

          marker = 'function applyPortalPresentationFixes(){'
          if 'function findHomepageHeroTitle(){' not in text:
              if marker not in text:
                  raise SystemExit('Marker hero tidak ditemukan')
              text = text.replace(marker, helper + '\n' + marker, 1)

          p.write_text(text, encoding='utf-8')

          idx = Path('index.html')
          html = idx.read_text(encoding='utf-8')
          html, count = re.subn(
              r'bpd-portal-berita\.js(?:\?v=[^"\']*)?',
              'bpd-portal-berita.js?v=20260812-recovery1',
              html
          )
          if count == 0:
              raise SystemExit('Referensi bpd-portal-berita.js tidak ditemukan di index.html')
          idx.write_text(html, encoding='utf-8')
          PY

      - name: Validasi JavaScript
        run: node --check bpd-portal-berita.js

      - name: Simpan pemulihan
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bpd-portal-berita.js index.html
          if git diff --cached --quiet; then
            echo "Portal sudah dalam kondisi pulih."
            exit 0
          fi
          git commit -m "Pulihkan loader portal berita dan hero beranda"
          git push
