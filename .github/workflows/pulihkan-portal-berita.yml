name: Pulihkan portal berita BPD Somagede

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pulihkan-portal-berita.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pulihkan fungsi shell portal
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("bpd-portal-berita.js")
          s = p.read_text(encoding="utf-8")

          if "function buildShell(){" in s:
              print("buildShell sudah ada. Tidak ada perubahan.")
          else:
              marker = "async function load(){"

              shell = r'''function buildShell(){
  mount.innerHTML=`
    <div class="portal-news-layout">
      <main class="portal-news-main" id="portalArticle">
        <div class="portal-news-loading">Memuat berita terbaru…</div>
      </main>
      <aside class="portal-news-side" aria-label="Arsip dan berita terbaru">
        <div id="portalSide"></div>
      </aside>
    </div>
    <div class="portal-toast" id="portalToast" aria-live="polite"></div>`;
}

'''

              if marker not in s:
                  raise SystemExit(
                      "AMAN: marker async function load() tidak ditemukan. "
                      "Tidak ada perubahan yang dilakukan."
                  )

              s = s.replace(marker, shell + marker, 1)
              p.write_text(s, encoding="utf-8")
              print("Fungsi buildShell berhasil dipulihkan.")

          PY

      - name: Validasi JavaScript
        run: |
          node --check bpd-portal-berita.js
          grep -q 'function buildShell(){' bpd-portal-berita.js
          grep -q 'id="portalArticle"' bpd-portal-berita.js
          grep -q 'id="portalSide"' bpd-portal-berita.js
          echo "VALIDASI BERHASIL"

      - name: Simpan perubahan dan hapus workflow sekali jalan
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add bpd-portal-berita.js
          git rm .github/workflows/pulihkan-portal-berita.yml

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
            exit 0
          fi

          git commit -m "Pulihkan tampilan portal berita"
          git push
