<script>
const root=document.documentElement;
root.dataset.theme=localStorage.getItem("bpd-theme")||"light";
const themeBtn=document.getElementById("themeBtn");
if(themeBtn){
  themeBtn.textContent=root.dataset.theme==="dark"?"☀️":"🌙";
  themeBtn.onclick=()=>{
    root.dataset.theme=root.dataset.theme==="dark"?"light":"dark";
    localStorage.setItem("bpd-theme",root.dataset.theme);
    themeBtn.textContent=root.dataset.theme==="dark"?"☀️":"🌙";
  };
}
const menuBtn=document.getElementById("menuBtn");
const links=document.getElementById("links");
if(menuBtn&&links)menuBtn.onclick=()=>links.classList.toggle("open");

function apiBase(){
  const x=(window.BPD_CMS_API||"").trim().replace(/\/$/,"");
  return x&&!x.includes("PASTE_URL")?x:"";
}
function mediaUrl(key){
  return key?apiBase()+"/media/"+key.split("/").map(encodeURIComponent).join("/"):"";
}
function esc(s=""){
  return String(s).replace(/[&<>"']/g,m=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[m]);
}
function indoDate(x){
  try{
    return new Date(x+"T00:00:00").toLocaleDateString("id-ID",{
      day:"numeric",month:"long",year:"numeric"
    });
  }catch{return x}
}
function updateNet(){
  const s=document.querySelector(".status");
  if(s)s.textContent=navigator.onLine?"● Online":"● Offline · data terakhir";
}
addEventListener("online",updateNet);
addEventListener("offline",updateNet);
updateNet();

const activityId=new URLSearchParams(location.search).get("id");
const article=document.getElementById("article");

async function loadDetail(){
  if(!apiBase()||!activityId){
    article.innerHTML="<h1>Kegiatan tidak ditemukan</h1>";
    return;
  }
  try{
    const d=await fetch(apiBase()+"/api/activities/"+activityId).then(r=>r.json());
    if(!d.ok)throw Error(d.error);
    const x=d.item;
    document.title=x.title+" | BPD Desa Somagede";

    article.innerHTML=`
      <div class="eyebrow" style="color:var(--green)">${esc(x.category)}</div>
      <h1>${esc(x.title)}</h1>
      <div class="muted">📅 ${indoDate(x.activity_date)} ${x.location?" · 📍 "+esc(x.location):""}</div>
      <p><b>${esc(x.excerpt||"")}</b></p>
      <div style="white-space:pre-wrap">${esc(x.content||"")}</div>
      ${x.images&&x.images.length?`
        <h2>Dokumentasi</h2>
        <div class="gallery">
          ${x.images.map((im,i)=>`
            <a href="${im.url}" target="_blank">
              <img loading="lazy" src="${im.url}" alt="Dokumentasi ${i+1}">
            </a>`).join("")}
        </div>`:""}
    `;
  }catch(e){
    article.innerHTML="<h1>Gagal memuat kegiatan</h1><p>"+esc(e.message)+"</p>";
  }
}
loadDetail();
</script></body></html>
